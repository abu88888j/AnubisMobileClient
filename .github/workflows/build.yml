
name: Build Minecraft Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -o AnubisMobileClient-1.21.11-QA.zip -d project
          find project -name build.gradle -print

      - name: Compile
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AnubisMobileClient-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
concurrency: 
