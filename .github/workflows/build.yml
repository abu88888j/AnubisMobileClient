name: Build Minecraft Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The project has no Gradle wrapper, and Fabric Loom 1.18 needs a recent Gradle 9.x,
      # so pin the Gradle version instead of relying on whatever the runner ships.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Extract project
        run: |
          unzip -o AnubisMobileClient-1.21.11-QA.zip -d project
          find project -name build.gradle -print

      - name: Compile
        run: |
          BUILD_FILE=$(find project -name build.gradle -print -quit)
          test -n "$BUILD_FILE"
          cd "$(dirname "$BUILD_FILE")"
          set +e
          gradle build --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            # Show the Gradle/compiler errors as annotations so they are readable from the run summary page.
            python3 - <<'PY'
          import os, re
          log = open(os.path.join(os.environ["GITHUB_WORKSPACE"], "gradle.log"), errors="replace").read()
          enc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          keys = re.compile(r"error:|What went wrong|FAILURE|Could not|not found|Execution failed|Unsupported|incompatible|Caused by|Plugin", re.I)
          lines = [l[:300] for l in log.splitlines() if keys.search(l)]
          print("::error title=Gradle error lines::" + enc("\n".join(lines[:50])[:5000]))
          print("::error title=Gradle log tail::" + enc(log[-5000:]))
          PY
          fi
          exit "$STATUS"

      - uses: actions/upload-artifact@v4
        with:
          name: AnubisMobileClient-JAR
          path: |
            project/**/build/libs/*.jar
            !project/**/build/libs/*-sources.jar
          if-no-files-found: error
